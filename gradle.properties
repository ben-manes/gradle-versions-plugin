GROUP=io.github.ben-manes
VERSION_NAME=0.62.0

# The test tasks of every JDK share a project, and only the configuration cache runs the tasks of
# one project at once.
org.gradle.configuration-cache=true

# When none of a test task's inputs change, its results are restored from the build cache without a
# run, so a spec must not assert on anything a remote repository can change, such as a latest release.
org.gradle.caching=true

# Gradle loads the Kotlin standard library for a plugin from its own distribution, so the plugin
# compiles against it without publishing a requirement that can conflict with the Kotlin of a build.
kotlin.stdlib.default.dependency=false

POM_URL=https://github.com/ben-manes/gradle-versions-plugin
POM_SCM_URL=https://github.com/ben-manes/gradle-versions-plugin

PLUGIN_NAME=io.github.ben-manes.versions
PLUGIN_NAME_CLASS=com.github.benmanes.gradle.versions.VersionsPlugin
PLUGIN_LEGACY_NAME=com.github.ben-manes.versions
PLUGIN_LEGACY_NAME_CLASS=com.github.benmanes.gradle.versions.LegacyVersionsPlugin
PLUGIN_CONTRIBUTOR_NAME=io.github.ben-manes.versions.contributor
PLUGIN_CONTRIBUTOR_NAME_CLASS=com.github.benmanes.gradle.versions.VersionsContributorPlugin
PLUGIN_SETTINGS_NAME=io.github.ben-manes.versions.settings
PLUGIN_SETTINGS_NAME_CLASS=com.github.benmanes.gradle.versions.VersionsSettingsPlugin
