name: deploy

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Verify Release Version
        run: |
          grep -qxF "VERSION_NAME=${GITHUB_REF_NAME#v}" gradle.properties || {
            echo "::error::Refusing to publish: ref '${GITHUB_REF_NAME}' does not match $(grep ^VERSION_NAME= gradle.properties)"
            exit 1
          }

  # The tag is tested here before publishing. The build of `master` may still be running when a
  # release is dispatched, and no build runs for a change to only `README.md` or `CONTRIBUTING.md`.
  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    permissions:
      checks: write
      pull-requests: write

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins -s

      - name: Verify Portal Publication
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            if curl -sf https://plugins.gradle.org/m2/io/github/ben-manes/gradle-versions-plugin/maven-metadata.xml \
                 | grep -qF "<version>${VERSION}</version>"; then
              echo "The portal serves ${VERSION}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::The portal is not serving ${VERSION}. The release is left as a draft."
          exit 1

      # Last, because it notifies watchers and a release cannot be un-notified.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
