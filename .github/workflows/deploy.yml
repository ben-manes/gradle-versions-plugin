name: deploy

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify Release Version
        run: |
          grep -qxF "VERSION_NAME=${GITHUB_REF_NAME#v}" gradle.properties || {
            echo "::error::Refusing to publish: ref '${GITHUB_REF_NAME}' does not match $(grep ^VERSION_NAME= gradle.properties)"
            exit 1
          }

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # A rebase merge produces a commit no pull request check ran on, so the tag can
      # carry a tree the build workflow has never seen. Build it here, where a failure
      # still stops the publication.
      - name: Run build with caching enabled
        run: ./gradlew clean build -s

      - name: Publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins -s
