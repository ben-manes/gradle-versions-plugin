[versions]
# The oldest Gradle the plugin supports, and the Groovy that release bundles.
gradle-minimum = "8.4"
groovy-minimum = "3.0.17"
kotlin = "2.4.10"

[plugins]
dokka = { id = "org.jetbrains.dokka", version = "2.0.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "12.2.0" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
versions = { id = "com.github.ben-manes.versions", version = "0.52.0" }

[libraries]
gradle-api-minimum = { module = "dev.gradleplugins:gradle-api", version.ref = "gradle-minimum" }
groovy-minimum = { module = "org.codehaus.groovy:groovy-all", version.ref = "groovy-minimum" }
# Versionless, so that it tracks the JUnit platform that Spock's own bom pins.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
moshi = { module = "com.squareup.moshi:moshi-kotlin", version = "1.12.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
spock = { module = "org.spockframework:spock-junit4", version = "2.4-M4-groovy-4.0" }
